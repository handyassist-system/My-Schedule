<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生活管家</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#3E9B8E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活管家">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F3; --surface:#FFFFFF; --line:#EFECE7; --danger:#C0392B;
    --ink:#2E2E33; --muted:#8A8A92; --faint:#B0B0B8;
    --primary:#3E9B8E; --primary-d:#33857A; --primary-soft:#E8F3F1;
    --work:#5B8DEF; --life:#3E9B8E; --health:#F2A385; --important:#E8735C;
    --hi:#E8735C; --mid:#F2A385; --low:#B0B0B8;
    --done:#3E9B8E; --accent:#F2A385; --accent-soft:#FDEEE7;
    --shadow:0 2px 12px rgba(46,46,51,.06),0 8px 24px rgba(46,46,51,.05);
    --r:16px;
  /* ── 智在生活共用命名（四個 App 都用這組名字，值各自不同）── */
  --sub:var(--muted);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:16px}   /* 16px：iPhone 點輸入框才不會自動放大 */
  .hidden{display:none!important}

  /* ---------- Login ---------- */
  #login{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);
  }
  .login-card{
    width:100%;max-width:360px;background:var(--surface);border-radius:20px;
    padding:32px 26px;box-shadow:var(--shadow);text-align:center;
  }
  .login-card .logo{font-size:40px;line-height:1;margin-bottom:14px}
  .login-card h1{margin:0 0 4px;font-size:21px;letter-spacing:.5px}
  .login-card p{margin:0 0 24px;color:var(--muted);font-size:13.5px}
  .login-card p .kw{font-size:12px;opacity:.7}
  .code-input{
    width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;
    text-align:center;font-size:16px;letter-spacing:0;outline:none;background:var(--surface);
    transition:border-color .15s;
  }
  .code-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .btn-primary{
    width:100%;margin-top:14px;padding:15px;border-radius:12px;
    background:var(--primary);color:#fff;font-size:16px;font-weight:600;
    transition:background .15s,transform .05s;
  }
  .btn-primary:active{transform:scale(.99);background:var(--primary-d)}
  .btn-primary:disabled{opacity:.55;cursor:default}
  .login-msg{margin-top:14px;min-height:18px;font-size:13px;color:var(--important)}
  .link-btn{margin-top:18px;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px}
  .code-hint{margin-top:10px;font-size:12.5px;color:var(--muted);letter-spacing:0;text-align:center}
  /* 管理員登入（次要按鈕：有框線、無底色）與家人登入說明 */
  .btn-secondary{width:100%;margin-top:14px;padding:13px;border-radius:12px;background:transparent;
    color:var(--primary);font-size:15px;font-weight:600;border:1.5px solid var(--primary)}
  /* ---------- 設定（整頁式，智在生活 Standard）---------- */
  #settingsPage{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);
    max-width:520px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #settingsPage.show{display:block}
  .set-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .set-head h2{margin:0;font-size:18px;font-weight:800}
  .set-back{background:none;border:none;font-size:30px;line-height:1;color:var(--ink);padding:0 10px 4px;margin-left:-4px}
  .set-body{padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
  .set-acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px}
  .set-acc .em{font-size:15px;font-weight:700;word-break:break-all}
  .set-acc .pl{margin-top:8px;display:inline-block;font-size:12.5px;font-weight:700;
    background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:5px 12px}
  .set-acc .ex{margin-top:8px;font-size:12.5px;color:var(--muted)}
  .set-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  /* 設定子頁：內容多的項目點進去看，有返回鍵，不用彈窗蓋住上下文 */
  #setSub{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:2}
  #setSub.show{display:flex}
  #setSub .set-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* 設定列表外框：讓整組列看起來是一張卡 */
  .set-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;margin-bottom:14px}
  /* 開關型項目的狀態標籤：開啟時填色，一眼看得出來 */
  .noti-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;
    background:var(--line);color:var(--muted)}
  .noti-pill.on{background:var(--primary);color:#fff}
  .set-row.danger{color:var(--danger);font-weight:700}
  .set-row.danger .ic{filter:none}
  /* 管理員入口：低調文字樣式，避免引起一般使用者好奇（智在生活 Standard） */
  #adminLoginToggle{width:100%;margin-top:18px;padding:8px;background:none;border:none;
    color:var(--muted);font-size:12.5px;font-weight:400;opacity:.75;cursor:pointer}
  #adminLoginToggle:active{opacity:1}
  .admin-input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
    font-size:16px;outline:none;margin-top:8px}
  .admin-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .family-hint{margin-top:12px;font-size:12px;line-height:1.7;color:var(--muted);text-align:left;
    background:var(--bg);border-radius:10px;padding:9px 11px}

  /* ---------- App shell ---------- */
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header.bar{
    position:sticky;top:0;z-index:20;background:rgba(246,247,251,.9);
    backdrop-filter:blur(8px);padding:5px 10px 5px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.bar .title{font-size:18px;font-weight:700;letter-spacing:.3px}
  header.bar .who{font-size:11px;color:var(--faint);margin-top:0}
  .logout{font-size:11px;color:var(--muted);padding:4px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
  .icobtn{font-size:17px;padding:7px 10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .icobtn svg{display:block}
  .dp-toggle{display:flex;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:4px;margin:8px 4px 2px}
  .dp-tab{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
  .dp-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  main{flex:1;padding:14px 14px 96px}

  /* ---------- Tabs ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;box-sizing:border-box;
    max-width:520px;margin:0 auto;background:var(--surface);
    border-top:1px solid var(--line);display:flex;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;box-sizing:border-box;
    padding:6px 0;color:var(--faint);font-size:11.5px;border-radius:12px;white-space:nowrap;
  }
  .tabbar button .ic{font-size:21px;line-height:1}
  .tabbar button.active{color:var(--primary);background:var(--primary-soft)}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 4px 7px;position:relative;padding:0 6px}
  .cal-head .month-title{font-size:22px;font-weight:700;padding:5px 10px;border-radius:12px}
  .cal-head .month-title .m-big{font-size:24px;font-weight:700;letter-spacing:.5px}
  .cal-head .month-title .m-year{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
  .today-btn{position:absolute;right:4px;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:500;color:var(--primary);background:var(--primary-soft)}
  .cal-head .month-title:active{background:var(--primary-soft)}
  .nav-btn{width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--muted);background:var(--surface);box-shadow:var(--shadow)}
  .cal-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 12px 12px;touch-action:pan-y}
  .weekrow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
  .weekrow span{text-align:center;font-size:12px;color:var(--faint);font-weight:600}
  .weekrow span.sun{color:#EF4444}.weekrow span.sat{color:#EF4444}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cell{
    aspect-ratio:1/1.1;min-height:46px;border-radius:13px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;position:relative;
    font-size:15px;color:var(--ink);
  }
  .cell.empty{visibility:hidden}
  .cell.other{color:var(--faint)}
  .cell:active{background:var(--bg)}
  .cell.today{font-weight:800;background:var(--accent);color:#fff}
  .cell.today .dot{background:rgba(255,255,255,.9)!important}
  .cell.sel{background:var(--primary);color:#fff}
  .cell.sel.today::before{border-color:rgba(255,255,255,.7)}
  .dots{display:flex;gap:3px;height:6px;align-items:center}
  .dot{width:6px;height:6px;border-radius:999px}
  .dot.work{background:var(--work)}.dot.life{background:var(--life)}
  .dot.health{background:var(--health)}.dot.important{background:var(--important)}
  .cell.sel .dot{box-shadow:0 0 0 1px rgba(255,255,255,.6)}

  .legend{display:flex;gap:14px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}

  /* ---------- Lists / cards ---------- */
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:9px 4px 7px}
  .section-head h2{font-size:15px;margin:0;font-weight:700}
  .section-head h2 .dh-date{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .add-btn{display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(62,155,142,.28)}
  .add-btn:active{background:var(--primary-d)}

  .card{
    background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
    padding:15px 16px;margin-bottom:11px;display:flex;gap:13px;align-items:flex-start;
  }
  .card .stripe{width:4px;align-self:stretch;border-radius:999px;flex:none;min-height:38px}
  .card .time-col{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;flex:none}
  .card .time-col .tc-h{font-size:15px;font-weight:700;line-height:1.1;color:var(--ink)}
  .card .time-col .tc-ap{font-size:10px;color:var(--muted);margin-top:1px}
  .card .body{flex:1;min-width:0}
  .card .row1{display:flex;align-items:center;gap:8px}
  .card .name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .time{font-size:12.5px;color:var(--muted);margin-top:2px}
  .card .note{font-size:12.5px;color:var(--faint);margin-top:4px;white-space:pre-wrap;word-break:break-word}
  .pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;flex:none}
  .pill.work{background:#EAF1FE;color:#5B8DEF}
  .pill.life{background:#E8F3F1;color:#3E9B8E}
  .pill.health{background:#FDEEE7;color:#D9825F}
  .pill.important{background:#FBEAE6;color:#E8735C}
  .pill.hi{background:#FBEAE6;color:#E8735C}
  .pill.mid{background:#FDEEE7;color:#D9825F}
  .pill.low{background:#EFECE7;color:#8A8A92}
  .card .acts{display:flex;gap:6px;flex:none}
  .icon-btn{width:34px;height:34px;border-radius:11px;font-size:15px;color:var(--muted);background:var(--bg)}
  .icon-btn[disabled]{opacity:.3;pointer-events:none}
  .icon-btn:active{background:var(--line)}

  /* shopping item check */
  .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin-top:1px}
  .check.on{background:var(--done);border-color:var(--done)}
  .item.done .name{text-decoration:line-through;color:var(--faint)}

  .qty{font-size:12.5px;color:var(--muted)}
  .filters{display:flex;flex-direction:column;gap:8px;padding:2px 4px 12px}
  .filter-row{display:flex;gap:8px;align-items:center}
  .filter-label{font-size:12px;color:var(--faint);font-weight:700;min-width:30px;flex:none}
  .filters select{
    flex:1 1 0;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--ink);outline:none;font-size:14px;
  }
  .empty-state{text-align:center;color:var(--muted);padding:44px 20px;font-size:14px;font-weight:600;line-height:1.6}
  .empty-state .eico{display:block;font-size:40px;margin-bottom:10px;opacity:.85;font-weight:400}
  .empty-state .esub{display:block;font-size:12.5px;color:var(--faint);font-weight:400;margin-top:6px}
  .ov-hint{font-size:12px;color:var(--muted);background:var(--primary-soft);border-radius:10px;padding:8px 12px;margin:0 4px 10px;line-height:1.5}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(20,24,40,.4);display:flex;align-items:flex-end;justify-content:center}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:90vh;overflow-y:auto;animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:2px 0 16px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{
    width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;outline:none;
    background:var(--surface);color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
  .field textarea{resize:vertical;min-height:64px}
  .two{display:flex;gap:10px}.two>*{flex:1}
  .sheet-acts{display:flex;gap:10px;margin-top:8px}
  .sheet-acts .btn-primary{margin-top:0}
  .btn-ghost{flex:none;padding:15px 18px;border-radius:12px;background:var(--bg);color:var(--muted);font-weight:600}
  .btn-danger{width:100%;margin-top:10px;padding:13px;border-radius:12px;background:#FDE8E8;color:#DC2626;font-weight:600}

  .day-events{margin-top:6px}
  /* 點擊區補到 40px：只擴大可按範圍，不改外觀大小 */
  .icon-btn, .nav-btn, .cal-del, .ms-del, .pocket-add button, .icobtn, .chip, .person-row .del, .clr-btn{ position:relative; }
  .icon-btn::after, .nav-btn::after, .cal-del::after, .ms-del::after, .pocket-add button::after,
  .icobtn::after, .chip::after, .person-row .del::after, .clr-btn::after{
    content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    min-width:40px; min-height:40px; width:100%; height:100%;
  }
  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:rgba(45,50,56,.94);color:#fff;padding:11px 18px;border-radius:999px;
    font-size:13.5px;line-height:1.5;max-width:84%;text-align:center;
    z-index:9999;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1}

  /* ---- 第一批：假日 / 急迫 / 倒數 / 開關 ---- */
  .cell.holiday .num{color:#EF4444;font-weight:700}
  .cell.sel.holiday .num{color:#fff}
  .dots .urg{font-size:9px;line-height:1}
  .hol-banner{background:#FDECEC;color:#DC2626;font-size:13px;font-weight:600;
    padding:8px 12px;border-radius:10px;margin-bottom:10px;text-align:center}
  .urg-badge{font-size:13px;flex:none;line-height:1}
  .card.urgent-card{box-shadow:0 0 0 1.5px rgba(239,68,68,.45),var(--shadow)}
  .countdown{display:inline-block;margin-top:5px;font-size:12px;font-weight:600;
    color:#B45309;background:#FEF3E2;padding:2px 9px;border-radius:999px}
  /* ── 記事表單：待辦／純紀錄、何時區塊、更多選項 ── */
  .kind-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field .kind-pick label.kind-opt{display:grid;grid-template-columns:auto 1fr;align-items:center;
    gap:8px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);
    cursor:pointer;font-size:14px;margin:0;color:var(--ink);font-weight:400}
  .field .kind-pick label.kind-opt input[type=radio]{width:17px;height:17px;padding:0;margin:0;border-radius:50%}
  .kind-opt span{display:block;line-height:1.3}
  .kind-opt b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
  .kind-opt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;font-weight:400}
  .kind-opt:has(input:checked){border-color:var(--accent,#5B8DEF);background:rgba(91,141,239,.07)}

  .whenbox{border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:13px;background:var(--bg)}
  .whenbox-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:9px}
  .whenbox .field{margin-bottom:8px}
  .whenbox .wk{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:3px;min-height:15px}
  .when-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .when-btns .btn-ghost{padding:5px 11px;font-size:12px}

  .more-toggle{width:100%;background:none;border:none;color:var(--accent,#5B8DEF);font-family:inherit;
    font-size:14px;font-weight:600;padding:10px 0;text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px}
  .more-dot{width:7px;height:7px;border-radius:50%;background:#E8A33D;display:inline-block}
  .morebox{border-top:1px solid var(--line);padding-top:12px;margin-bottom:6px}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;
    padding:11px 2px;border-top:1px solid var(--line);font-size:14px;color:var(--ink)}
  .toggle-row:first-of-type{border-top:none}
  .switch{position:relative;display:inline-block;width:46px;height:27px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:#D7DBE3;border-radius:999px;transition:.2s}
  .switch .slider::before{content:"";position:absolute;height:21px;width:21px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--primary)}
  .switch input:checked + .slider::before{transform:translateX(19px)}

  /* ---- 第二批 2a：記事/分類/執行人/待購分組 ---- */

/* ===== 底部導覽：四個 App 同一套規格（高度 58px、圖示 21px、字 11.5px、反白加底色）===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; box-sizing:border-box;
  max-width:520px; margin:0 auto; z-index:40; display:flex; align-items:stretch;
  background:var(--surface); border-top:1px solid var(--line);
  padding:5px 8px calc(5px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1 1 0; min-width:0; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:6px 2px; min-height:48px;
  background:none; border:none; border-radius:12px;
  color:var(--faint); font-family:inherit; font-size:11.5px; font-weight:600;
  line-height:1.25; white-space:nowrap; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.tabbar button .ic{ font-size:21px; line-height:1; }
.tabbar button.active{ color:#3E9B8E; background:#E8F3F1; font-weight:700; }
.tabbar button:active{ opacity:.65; }

/* ===== 設定列表：四個 App 同一套規格（列高 52、圖示 18、名稱 15、狀態值 13）=====
   三個 App 的 class 名稱不同（.set-row／.settings-row，內層 .ic/.tx/.ar 與
   .set-ico/.set-name/.set-val/.set-arrow），這裡一次涵蓋，不動既有標籤。 */
.set-row, .settings-row{
  display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box;
  min-height:52px; padding:14px; margin:0;
  background:none; border:none; border-bottom:1px solid var(--line); border-radius:0;
  font-family:inherit; font-size:15px; font-weight:500; color:var(--ink);
  text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.set-row:last-child, .settings-row:last-child{ border-bottom:none; }
.set-row:active, .settings-row:active{ background:var(--bg); }
.set-row .ic, .set-row .set-ico, .settings-row .settings-row-icon{
  flex:0 0 auto; width:24px; text-align:center; font-size:18px; line-height:1;
}
.set-row .tx, .set-row .set-name, .settings-row .settings-row-label{
  flex:0 0 auto; white-space:nowrap;
}
.set-row .set-val{
  flex:1 1 auto; min-width:0; text-align:right; font-size:13px; font-weight:400;
  color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.set-row .ar, .set-row .set-arrow{
  flex:0 0 auto; margin-left:auto; font-size:19px; line-height:1; color:var(--muted);
}
.set-gap{ height:14px; background:none; border:none; }

  /* 危險動作（登出）不給箭頭：它不是「進入某頁」，而是當下就執行 */
  .set-row.danger .ar, .set-row.danger .set-arrow{ display:none; }
  .set-row.danger, .settings-row.danger{ color:var(--danger); font-weight:700; }
  /* 管理員項目不另外加底色，跟其他 App 一致 */
  .settings-row.admin{ background:none; border-color:inherit; }
  /* 食在料理原本沒有箭頭，用 CSS 補上，標籤不用改 */
  .settings-row:not(.danger)::after{
    content:"›"; margin-left:auto; font-size:19px; line-height:1; color:var(--muted); flex:0 0 auto;
  }
</style>

// 「6/25（三）」週末紅字（回傳 HTML，內容皆系統產生、安全）

// 距今天幾天（負=逾期）
function _daysFromToday(ds){
  if(!ds) return null; const p=String(ds).split("-");
  const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); d.setHours(0,0,0,0);
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
// 里程碑日期標籤：📅6/28（六）剩4天 / 逾2天（逾期/今天/3天內→紅）；done→灰、只顯示日期
function _msDate(ds, done){
  if(!ds) return "";
  const p=String(ds).split("-"); const md=Number(p[1])+"/"+Number(p[2]); const wd=_WD[_wdOf(ds)];
  const base="📅"+md+"（"+wd+"）";
  if(done) return '<span class="msd msd-faint">'+base+'</span>';
  const dd=_daysFromToday(ds); let tail="", red=false;
  if(dd<0){ tail="逾"+(-dd)+"天"; red=true; }
  else if(dd===0){ tail="今天"; red=true; }
  else if(dd<=3){ tail="剩"+dd+"天"; red=true; }
  else { tail="剩"+dd+"天"; }
  return '<span class="msd'+(red?' msd-red':' msd-faint')+'">'+base+tail+'</span>';
}

  return act+"失敗，請稍後再試";
}

/* ---------- 重複（3b） ---------- */
const REPEAT_UNIT_LABEL = { day:"天", week:"週", month:"個月", year:"年" };
function hasRepeat(r){ return r && r.repeat && r.repeat.unit && r.repeat.unit!=="none"; }
function repeatText(rep){
  if(!rep || !rep.unit || rep.unit==="none") return "";
  const n=Math.max(1, rep.every||1);
  return "🔁 每"+(n>1?n:"")+REPEAT_UNIT_LABEL[rep.unit];
}
// 任一重複記事：某日(YYYY-MM-DD)是否落在重複發生日（O(1)、用算的，不生成資料）
function occursOn(r, dateStr){
  if(!hasRepeat(r) || !r.dateStart) return false;
  if(dateStr < r.dateStart) return false;
  if(r.repeatUntil && dateStr > r.repeatUntil) return false;   // 已停止重複：界線之後不再出現
  const b=r.dateStart.split("-").map(Number);
  const t=dateStr.split("-").map(Number);
  const n=Math.max(1, r.repeat.every||1), u=r.repeat.unit;
  if(u==="year"){
    if(t[1]!==b[1] || t[2]!==b[2]) return false;     // 同月同日（閏2/29只會對到閏年）
    const dy=t[0]-b[0];
    return dy>=0 && dy%n===0;
  }
  if(u==="month"){
    if(t[2]!==b[2]) return false;                    // 同一號（31號只會對到有31天的月）
    const md=(t[0]-b[0])*12+(t[1]-b[1]);
    return md>=0 && md%n===0;
  }
  const diff=Math.round((Date.UTC(t[0],t[1]-1,t[2]) - Date.UTC(b[0],b[1]-1,b[2]))/86400000);
  if(diff<0) return false;
  if(u==="week") return diff%(7*n)===0;
  return diff%n===0;                                  // day
}
// 某「發生日」這個記事是否已完成（重複的一般記事看 doneDates；其餘看整筆）
function isDoneOn(r, dateStr){
  if(!r || r.isLog) return false;                       // 純紀錄無完成
  if(hasRepeat(r) && r.category!=="shopping" && r.dateStart){
    return Array.isArray(r.doneDates) && r.doneDates.indexOf(dateStr)>=0;
  }
  return isDone(r);                                      // 非重複 / 採購：整筆完成
}
// 某「發生日」這個記事的顯示類別（log / done / scheduled / …）
function kindOn(r, dateStr){
  if(r && r.isLog) return "log";
  if(hasRepeat(r) && r.category!=="shopping" && r.dateStart){
    return isDoneOn(r, dateStr) ? "done" : "scheduled";
  }
  return recKind(r);
}
// 在某日期(YYYY-MM-DD)往後加一個間隔
function addInterval(ymdStr, rep){
  const p=ymdStr.split("-").map(Number);
  const dt=new Date(p[0], p[1]-1, p[2]);
  const n=Math.max(1, rep.every||1);
  if(rep.unit==="day")        dt.setDate(dt.getDate()+n);
  else if(rep.unit==="week")  dt.setDate(dt.getDate()+7*n);
  else if(rep.unit==="month") dt.setMonth(dt.getMonth()+n);
  else if(rep.unit==="year")  dt.setFullYear(dt.getFullYear()+n);
  return ymd(dt);
}
// 從 base 日往後推，找到第一個 >= today 的日期（跳過已過的，避免堆積）
function nextFutureDate(base, rep, today){
  let d=addInterval(base, rep), guard=0;
  while(d < today && guard<2000){ d=addInterval(d, rep); guard++; }
  return d;
}
// 產生「下一筆」記事物件（不含 id），用於 onDone（採購/任務完成後）
function buildNextRecord(r, baseDate){
  const today=ymd(new Date());
  let nd=addInterval(baseDate, r.repeat);
  if(nd < today) nd=nextFutureDate(baseDate, r.repeat, today);
  const copy=Object.assign({}, r);
  delete copy.id;
  copy.dateStart=nd;
  copy.doneDate=null; copy.status="pending"; copy.kind="scheduled";
  copy.spawned=false;
  copy.createdAt=Date.now();
  return copy;
}
function _recSig(r){   // 記事識別碼：完全相同的視為重複
  return [(r.cal||"main"),(r.title||"").trim(),(r.category||""),(r.dateStart||""),

}

// 一鍵清除重複記事（標題+分類+日期+重複規則完全相同 → 只留一筆）
function scanDuplicateRecords(){
  var groups={}, dupIds=[];
  Object.keys(state.records).forEach(function(id){
    var r=state.records[id]; if(!r) return;
