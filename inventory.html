<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#3E9B8E">

<title>庫存管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --bg:#FBF8F3;--surface:#FFF;--surface2:#F3F0EB;--ink:#2E2E33;--ink2:#8A8A92;--ink3:#B0B0B8;
  --accent:#3E9B8E;--accent-light:#E8F3F1;--warn:#E8735C;--warn-light:#FBEAE6;
  --amber:#C98A1B;--amber-light:#FDF3E3;--border:#EDE7DF;--danger:#C0392B;
  --radius:14px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(46,46,51,.06),0 8px 24px rgba(46,46,51,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6;padding-bottom:40px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
header{position:sticky;top:0;z-index:40;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.hrow{display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto}
.logo{flex:1;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:4px;height:20px;background:var(--accent);border-radius:2px;display:block}
.ver{font-size:10px;color:#aaa;font-weight:400}
.hbtn{border:none;background:none;font-size:21px;padding:6px;color:var(--ink2);min-width:40px;min-height:40px}
.searchrow{display:flex;gap:8px;max-width:560px;margin:8px auto 0}
.search{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;font-size:16px;background:var(--surface);outline:none;min-width:0}
.search:focus{border-color:var(--accent)}
.addbtn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:0 16px;font-size:15px;font-weight:700;min-height:44px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:560px;margin:8px auto 0;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.locsel{border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:14px;background:var(--surface);color:var(--ink2);min-height:34px;width:100%;outline:none}
.chip{flex:1 1 auto;white-space:nowrap;padding:6px 4px !important;font-size:12.5px !important;text-align:center;border:1.5px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:20px;padding:6px 14px;font-size:13px;min-height:34px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
main{max-width:560px;margin:0 auto;padding:6px 14px}
.sec{font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 2px 6px}
.sec.alert{color:var(--warn)}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:4px solid transparent;width:100%;text-align:left;border-top:none;border-right:none;border-bottom:none;color:inherit}
.card.expired{border-left-color:var(--warn)}
.card.soon{border-left-color:var(--amber)}
.ico{font-size:26px;flex:0 0 auto;width:34px;text-align:center}
.cbody{flex:1;min-width:0}
.cname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:0 0 auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--ink2)}
.tag.expired{background:var(--warn-light);color:var(--warn)}
.tag.soon{background:var(--amber-light);color:var(--amber)}
.tag.ok{background:var(--accent-light);color:var(--accent)}
.empty{text-align:center;padding:48px 20px;color:var(--ink2);font-weight:600}
.empty b{display:block;font-size:44px;margin-bottom:10px}
.empty span{display:block;font-size:12.5px;font-weight:400;color:var(--ink3);margin-top:6px}
/* sheet */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(28,27,24,.45);display:none;align-items:flex-end;justify-content:center}
.ovl.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sh-h{padding:16px 18px 6px;font-size:17px;font-weight:700}
.sh-b{padding:6px 18px 10px;overflow-y:auto;flex:1}
.sh-f{display:flex;gap:8px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-size:14.5px;font-weight:700;min-height:44px}
.btn.pri{background:var(--accent);color:#fff;flex:1}
.btn.gh{background:var(--surface2);color:var(--ink);border:1px solid var(--border)}
.btn.dg{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;font-size:16px;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.row2{display:flex;gap:10px}.row2>.field{flex:1;min-width:0}
.seg{display:flex;gap:6px}
.seg{flex-wrap:wrap}.seg button{flex:1 0 30%;border:1.5px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:10px 4px;font-size:14px;color:var(--ink2);min-height:44px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--border);background:var(--surface2);border-radius:16px;padding:5px 12px;font-size:12.5px;color:var(--ink2);min-height:32px}
.hint{font-size:12px;color:var(--ink3);margin-top:4px}
.warnline{font-size:13px;margin-top:6px;font-weight:600}
.setrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border)}
.setrow span{flex:1}
.mini{border:1px solid var(--border);background:var(--surface2);border-radius:8px;min-width:38px;min-height:38px;font-size:14px;color:var(--ink2)}
.setttl{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 0 6px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(45,50,56,.94);color:#fff;border-radius:999px;padding:11px 18px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:400;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.ro{display:none;background:var(--amber-light);color:#8A6112;padding:10px 14px;font-size:13px;align-items:center;gap:10px}
.ro a{background:#06C755;color:#fff;padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:700;font-size:12.5px}
#loginPage{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.login-card{background:#fff;border-radius:20px;padding:30px 24px;text-align:center;box-shadow:var(--shadow);max-width:340px}
.login-card .l{font-size:44px}.login-card h2{margin:8px 0;font-size:19px}.login-card p{color:var(--ink2);font-size:13.5px;line-height:1.8}
.login-card button{margin-top:16px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-weight:700;font-size:14.5px}
.update-bar{display:none;position:fixed;left:0;right:0;top:0;z-index:300;max-width:560px;margin:0 auto;background:var(--accent);color:#fff;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.update-bar span{flex:1;font-size:14px;font-weight:600}
.update-bar button{background:#fff;color:var(--accent);font-weight:700;font-size:13px;padding:8px 16px;border-radius:10px;border:none}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-card">
    <div class="l">🏠</div>
    <h2>庫存管理</h2>
    <p>請先登入「生活管家」<br>登入後即可自動使用庫存管理</p>
    <button onclick="location.href='https://handyassist-system.github.io/My-Schedule/'">前往行事曆登入</button>
  </div>
</div>

<div class="update-bar" id="updateBar"><span>🔄 有新版本可用</span><button id="updateBtn" type="button">立即更新</button></div>

<div id="appWrap" style="display:none">
  <div class="ro" id="roBar"><span style="flex:1">🔒 升級完整版可繼續編輯</span><a href="https://line.me/R/ti/p/@373pfdee" target="_blank" rel="noopener">升級</a></div>
  <header>
    <div class="hrow">
      <div class="logo"><i></i>庫存管理 <span class="ver" id="verTag"></span></div>
      <button class="hbtn" id="goCal" title="前往生活管家">📱</button>
      <button class="hbtn" id="goSet" title="設定">⚙️</button>
    </div>
    <div class="searchrow">
      <input class="search" id="q" type="search" placeholder="🔍 搜尋名稱、位置、品牌">
      <button class="addbtn" id="addBtn">＋ 新增</button>
    </div>
    <div class="chips" id="kindChips" style="flex-wrap:nowrap;gap:4px"></div>
    <div class="searchrow" style="margin-top:6px"><select id="locSel" class="locsel"></select></div>
  </header>
  <main id="list"></main>
</div>

<div class="ovl" id="ovl"><div class="sheet">
  <div class="sh-h" id="shT"></div>
  <div class="sh-b" id="shB"></div>
  <div class="sh-f" id="shF"></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
var APP_VER="v2.0", BUILD_ID="1009-51";
var ADMIN_EMAIL="mp65p@hotmail.com";
var CAL_URL='https://handyassist-system.github.io/My-Schedule/';
var KIND={food:{n:'食材',i:'🥬'},med:{n:'藥品',i:'💊'},daily:{n:'生活用品',i:'🧴'},kitchen:{n:'廚房用品',i:'🍳'},appliance:{n:'家電',i:'🔌'},other:{n:'其他',i:'📦'}};
var DEFAULT_LOCS=['客廳','廚房','臥室','浴室','陽台','儲藏室'];
var DEFAULT_CFG={foodDays:3,warrantyDays:30};
var firebaseConfig={
  apiKey:"AIzaSyBGfQ1oKOrt723tJ3w7LIwDLSh0nGwRF30",
  authDomain:"my-project-c89db.firebaseapp.com",
  databaseURL:"https://my-project-c89db-default-rtdb.firebaseio.com",
  projectId:"my-project-c89db",
  storageBucket:"my-project-c89db.firebasestorage.app",
  messagingSenderId:"301172719437",
  appId:"1:301172719437:web:83c981eea84caf77c38104"
};
var db=null, FB_READY=false;
try{ if(typeof firebase!=='undefined'){ firebase.initializeApp(firebaseConfig); db=firebase.database(); FB_READY=true; } }catch(e){ FB_READY=false; }

var userEmail=null, items=[], locs=null, cfg=Object.assign({},DEFAULT_CFG);
var READONLY=false, curLoc='', curKind='', editId=null, sheetKind='food', _ovlMode='';
var _listening=false;

/* ───────── 工具 ───────── */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function toDate(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function diffDays(a,b){return Math.round((toDate(a)-toDate(b))/86400000);}
function addDays(s,n){var d=toDate(s);d.setDate(d.getDate()+n);return ymd(d);}
function addMonths(s,m){var d=toDate(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);var dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,dim));return ymd(d);}
function emailKey(e){return String(e||"").toLowerCase().replace(/[.#$\[\]]/g,"_");}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
var _tt;
function toast(msg,ms){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},ms||1800);}
function failMsg(act,err){
  var code=String((err&&(err.code||err.message))||"");
  if((typeof navigator!=="undefined"&&navigator.onLine===false)||/unavailable|network|timeout|deadline|offline/i.test(code)) return act+"失敗，請檢查網路連線";
  if(/permission|denied|unauthenticated|auth/i.test(code)) return act+"失敗，請重新登入再試一次";
  return act+"失敗，請稍後再試";
}
function locked(){ if(READONLY){ toast('🔒 升級完整版即可編輯'); return true; } return false; }
function askConfirm(title,msg,onOk,okText){
  var old=$('akOvl'); if(old) old.remove();
  var d=document.createElement('div'); d.id='akOvl';
  d.style.cssText='position:fixed;inset:0;z-index:9000;background:rgba(28,27,24,.45);display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML='<div style="background:#fff;border-radius:16px;padding:22px 20px;max-width:340px;width:100%"><div style="font-size:16px;font-weight:700;margin-bottom:8px">'+title+'</div><div style="font-size:13.5px;color:var(--ink2);line-height:1.8">'+msg+'</div><div style="display:flex;gap:10px;margin-top:20px"><button id="akNo" class="btn gh" style="flex:1">取消</button><button id="akYes" class="btn" style="flex:1;background:var(--danger);color:#fff">'+(okText||'確定')+'</button></div></div>';
  document.body.appendChild(d);
  d.querySelector('#akNo').onclick=function(){d.remove();};
  d.querySelector('#akYes').onclick=function(){d.remove();onOk&&onOk();};
  d.addEventListener('click',function(e){if(e.target===d)d.remove();});
}

/* ───────── 狀態（有效日期／保固）───────── */
function dateOf(it){ return it.kind==='appliance' ? (it.warrantyEnd||'') : (it.expiry||''); }
function statusOf(it){
  var d=dateOf(it); if(!d) return null;
  var n=diffDays(d,today()), thr=it.kind==='appliance'?cfg.warrantyDays:cfg.foodDays, ap=it.kind==='appliance';
  if(n<0) return {st:'expired',n:n,label:ap?'保固已過':'過期 '+(-n)+' 天'};
  if(n===0) return {st:'soon',n:n,label:ap?'保固今天到期':'今天到期'};
  if(n<=thr) return {st:'soon',n:n,label:ap?'保固剩 '+n+' 天':'剩 '+n+' 天'};
  return {st:'ok',n:n,label:ap?'保固剩 '+n+' 天':'剩 '+n+' 天'};
}
function isAlert(it){ var s=statusOf(it); return !!s && s.st!=='ok' && !(it.kind==='appliance' && s.st==='expired' && -s.n>cfg.warrantyDays); }

/* ───────── 資料（users/<key>/stock）───────── */
function base(){ return 'users/'+emailKey(userEmail)+'/'; }
function cacheKey(){ return 'stock_cache_'+emailKey(userEmail); }
function saveCache(){ try{ localStorage.setItem(cacheKey(),JSON.stringify({items:items,locs:locs,cfg:cfg})); }catch(e){} }
function loadCache(){
  try{ var c=JSON.parse(localStorage.getItem(cacheKey())||'null'); if(c){ items=c.items||[]; locs=c.locs||null; cfg=Object.assign({},DEFAULT_CFG,c.cfg||{}); } }catch(e){}
}
function getLocs(){ return (locs&&locs.length)?locs:DEFAULT_LOCS; }
function clean(o){var r={};Object.keys(o).forEach(function(k){var v=o[k];if(v===undefined||v===null||v==='')return;r[k]=v;});return r;}
function listen(){
  if(!db||_listening) return; _listening=true;
  db.ref(base()+'stock').on('value',function(s){
    var v=s.val()||{}; items=Object.keys(v).map(function(k){var o=v[k]||{};o.id=k;return o;});
    saveCache(); render();
  },function(){});
  db.ref(base()+'stockLocs').on('value',function(s){
    var v=s.val(); locs=Array.isArray(v)?v.filter(Boolean):(v?Object.keys(v).map(function(k){return v[k];}):null);
    saveCache(); render();
  },function(){});
  db.ref(base()+'stockCfg').on('value',function(s){
    cfg=Object.assign({},DEFAULT_CFG,s.val()||{}); saveCache(); render();
  },function(){});
}
function writeItem(it){
  var id=it.id, rec=clean(Object.assign({},it,{id:undefined}));
  var i=items.findIndex(function(x){return x.id===id;});
  var local=Object.assign({id:id},rec); if(i>=0) items[i]=local; else items.push(local);
  saveCache(); render();
  if(db) db.ref(base()+'stock/'+id).set(rec).catch(function(e){ toast(failMsg('儲存',e)); });
}
function removeItem(id){
  items=items.filter(function(x){return x.id!==id;}); saveCache(); render();
  if(db) db.ref(base()+'stock/'+id).remove().catch(function(e){ toast(failMsg('刪除',e)); });
}
function saveLocs(arr){
  locs=arr.slice(); saveCache(); render();
  if(db) db.ref(base()+'stockLocs').set(arr).catch(function(e){ toast(failMsg('儲存',e)); });
}
function saveCfg(){
  saveCache();
  if(db) db.ref(base()+'stockCfg').set(cfg).catch(function(e){ toast(failMsg('儲存',e)); });
}

/* ───────── 舊資料轉換（只做一次，不動舊資料）───────── */
var FOOD_CATS=['fruit','veg','meat','frozen','grain','sauce','canned','drink','snack'];
function convertOld(old){
  var out=[], locSet=[];
  (old.items||[]).forEach(function(o){
    if(!o||!o.name) return;
    var kind=o.is3c?'appliance':(FOOD_CATS.indexOf(o.cat)>=0?'food':(o.cat==='medical'?'med':(['daily','personal','home'].indexOf(o.cat)>=0?'daily':'other')));
    var loc=o.location&&o.location!=='未分類'?o.location:'';
    if(loc&&locSet.indexOf(loc)<0) locSet.push(loc);
    out.push(clean({id:uid(),name:o.name,kind:kind,loc:loc,expiry:kind==='appliance'?'':(o.expiry||''),
      model:o.model,buyDate:o.buyDate,warrantyYears:o.warrantyYears,warrantyEnd:o.warrantyEnd,
      price:o.price,store:o.store,note:o.note,created:Date.now()}));
  });
  return {items:out,locs:locSet};
}
function migrateOnce(done){
  if(!db){ done(); return; }
  db.ref(base()+'stockMigrated').once('value').then(function(s){
    if(s.val()){ done(); return; }
    db.ref(base()+'stock').once('value').then(function(cur){
      if(cur.exists()){ db.ref(base()+'stockMigrated').set(true); done(); return; }
      function apply(old){
        var r=old?convertOld(old):{items:[],locs:[]};
        var updates={}; r.items.forEach(function(x){var id=x.id;delete x.id;updates['stock/'+id]=x;});
        if(r.locs.length){ var all=DEFAULT_LOCS.slice(); r.locs.forEach(function(l){if(all.indexOf(l)<0)all.push(l);}); updates['stockLocs']=all; }
        updates['stockMigrated']=true;
        db.ref(base()).update(updates).then(function(){ if(r.items.length) toast('已轉換 '+r.items.length+' 項舊資料',3000); done(); }).catch(function(){ done(); });
      }
      // 先讀雲端舊資料，沒有再讀本機
      db.ref('inventory/'+emailKey(userEmail)+'/blob').once('value').then(function(b){
        var old=null; try{ if(b.val()) old=JSON.parse(b.val()); }catch(e){}
        if(!old||!old.items||!old.items.length){
          try{ var l=JSON.parse(localStorage.getItem('inv_v7')||localStorage.getItem('inv_v6')||'null'); if(l&&l.length) old={items:l}; }catch(e){}
        }
        apply(old);
      }).catch(function(){
        var old=null; try{ var l=JSON.parse(localStorage.getItem('inv_v7')||localStorage.getItem('inv_v6')||'null'); if(l&&l.length) old={items:l}; }catch(e){}
        apply(old);
      });
    }).catch(function(){ done(); });
  }).catch(function(){ done(); });
}

/* ───────── 畫面 ───────── */
function render(){
  if($('appWrap').style.display==='none') return;
  // 位置按鈕
  var chips='<button class="chip'+(curKind===''?' on':'')+'" data-kind="">全部</button>';
  Object.keys(KIND).forEach(function(k){ chips+='<button class="chip'+(curKind===k?' on':'')+'" data-kind="'+k+'">'+KIND[k].n+'</button>'; });
  $('kindChips').innerHTML=chips;
  var L=getLocs().slice(); if(curLoc&&curLoc!=='__none__'&&L.indexOf(curLoc)<0) L.push(curLoc);
  var hasNone=items.some(function(it){return !it.loc;});
  $('locSel').innerHTML='<option value="">📍 全部位置</option>'+L.map(function(l){return '<option value="'+esc(l)+'"'+(curLoc===l?' selected':'')+'>'+esc(l)+'</option>';}).join('')+(hasNone?'<option value="__none__"'+(curLoc==='__none__'?' selected':'')+'>（不指定）</option>':'');
  // 篩選
  var kw=($('q').value||'').trim().toLowerCase();
  var arr=items.filter(function(it){
    if(curKind && it.kind!==curKind) return false;
    if(curLoc==='__none__'){ if(it.loc) return false; } else if(curLoc && it.loc!==curLoc) return false;
    if(kw){ var hay=((it.name||'')+' '+(it.loc||'')+' '+(it.model||'')+' '+(it.note||'')+' '+(it.store||'')).toLowerCase(); if(hay.indexOf(kw)<0) return false; }
    return true;
  });
  function key(it){ var s=statusOf(it); return s?s.n:99999; }
  var alerts=arr.filter(isAlert).sort(function(a,b){return key(a)-key(b);});
  var rest=arr.filter(function(it){return !isAlert(it);}).sort(function(a,b){
    var ka=key(a),kb=key(b); if(ka!==kb) return ka-kb; return String(a.name).localeCompare(String(b.name),'zh-Hant');
  });
  var html='';
  if(!items.length){
    html='<div class="empty"><b>📦</b>還沒有物品<span>按右上「＋ 新增」，記下東西放哪裡、食材的有效日期、家電的保固</span></div>';
  } else if(!arr.length){
    html='<div class="empty"><b>🔍</b>找不到符合的物品</div>';
  } else {
    if(alerts.length) html+='<div class="sec alert">⚠️ 快到期（'+alerts.length+'）</div>'+alerts.map(card).join('');
    if(rest.length) html+=(alerts.length?'<div class="sec">全部（'+rest.length+'）</div>':'')+rest.map(card).join('');
  }
  $('list').innerHTML=html;
}
function card(it){
  var s=statusOf(it), sub=[];
  if(it.loc) sub.push(it.loc);
  if(it.kind==='appliance'&&it.model) sub.push(it.model);
  else if(it.note) sub.push(it.note);
  return '<button class="card'+(s&&s.st!=='ok'?' '+s.st:'')+'" data-id="'+esc(it.id)+'">'
    +'<span class="ico">'+(KIND[it.kind]||KIND.other).i+'</span>'
    +'<span class="cbody"><div class="cname">'+esc(it.name)+'</div><div class="csub">'+esc(sub.join('・')||(KIND[it.kind]||KIND.other).n)+'</div></span>'
    +(s?'<span class="tag '+s.st+'">'+s.label+'</span>':'')
    +'</button>';
}

/* ───────── 新增／編輯 ───────── */
function lastLoc(){ try{return localStorage.getItem('stock_lastLoc')||'';}catch(e){return '';} }
function setLastLoc(v){ try{localStorage.setItem('stock_lastLoc',v);}catch(e){} }
function openSheet(title,body,footer,mode){ $('shT').textContent=title; $('shB').innerHTML=body; $('shF').innerHTML=footer; $('ovl').classList.add('open'); _ovlMode=mode||''; }
function closeSheet(){ $('ovl').classList.remove('open'); editId=null; _ovlMode=''; }
function locOptions(sel){
  var L=getLocs().slice(); if(sel&&L.indexOf(sel)<0) L.push(sel);
  return '<option value="">（不指定）</option>'+L.map(function(l){return '<option'+(l===sel?' selected':'')+' value="'+esc(l)+'">'+esc(l)+'</option>';}).join('')+'<option value="__new__">＋ 新增位置…</option>';
}
function kindFields(kind,it){
  it=it||{};
  if(kind==='appliance'){
    var wy=it.warrantyYears||'';
    return '<div class="field"><label>品牌型號</label><input id="fModel" value="'+esc(it.model||'')+'" placeholder="例：Panasonic NR-B582"></div>'
      +'<div class="row2"><div class="field"><label>購買日期</label><input id="fBuy" type="date" value="'+esc(it.buyDate||'')+'"></div>'
      +'<div class="field"><label>保固年限</label><select id="fWy"><option value="">未設定</option>'
      +[0.5,1,2,3,5,10].map(function(y){return '<option value="'+y+'"'+(+wy===y?' selected':'')+'>'+(y<1?'半年':y+' 年')+'</option>';}).join('')+'</select></div></div>'
      +'<div id="wEnd" class="warnline"></div>'
      +'<div class="row2"><div class="field"><label>金額</label><input id="fPrice" type="number" inputmode="numeric" value="'+esc(it.price||'')+'" placeholder="選填"></div>'
      +'<div class="field"><label>購買通路</label><input id="fStore" value="'+esc(it.store||'')+'" placeholder="選填"></div></div>';
  }
  if(kind==='food'||kind==='med'){
    var qs=kind==='med'?[[30,'1個月後'],[90,'3個月後'],[180,'半年後'],[365,'1年後']]:[[3,'3天後'],[7,'1週後'],[14,'2週後'],[30,'1個月後'],[90,'3個月後']];
    return '<div class="field"><label>有效日期</label><input id="fExp" type="date" value="'+esc(it.expiry||'')+'">'
      +'<div class="quick">'+qs.map(function(q){return '<button type="button" data-q="'+q[0]+'">'+q[1]+'</button>';}).join('')+'</div>'
      +'<div class="hint">有填才會在快到期時提醒</div></div>';
  }
  if(kind==='daily'||kind==='kitchen') return '';
  return '<div class="field"><label>有效日期（選填）</label><input id="fExp" type="date" value="'+esc(it.expiry||'')+'"></div>';
}
function updateWEnd(){
  var el=$('wEnd'); if(!el) return;
  var b=($('fBuy')||{}).value, y=parseFloat(($('fWy')||{}).value);
  if(b&&y){ var e=addMonths(b,Math.round(y*12)), n=diffDays(e,today());
    el.style.color=n<0?'var(--warn)':n<=cfg.warrantyDays?'var(--amber)':'var(--accent)';
    el.textContent='保固到期：'+e+(n<0?'（已過期）':'（剩 '+n+' 天）'); el.dataset.end=e;
  } else { el.textContent=''; el.dataset.end=''; }
}
function bindSheet(){
  var b=$('shB');
  b.querySelectorAll('[data-k]').forEach(function(x){ x.onclick=function(){ sheetKind=x.dataset.k; rebuildFields(); }; });
  b.querySelectorAll('[data-q]').forEach(function(x){ x.onclick=function(){ $('fExp').value=addDays(today(),+x.dataset.q); }; });
  var ls=$('fLoc'); if(ls) ls.onchange=function(){
    if(ls.value==='__new__'){
      var n=(prompt('新位置名稱')||'').trim(); var L=getLocs().slice();
      if(n){ if(L.indexOf(n)<0){ L.push(n); saveLocs(L); } ls.innerHTML=locOptions(n); } else ls.value='';
    }
  };
  ['fBuy','fWy'].forEach(function(id){ var e=$(id); if(e){ e.onchange=updateWEnd; e.oninput=updateWEnd; } });
  updateWEnd();
}
var _draft={};
function rebuildFields(){
  _draft={name:($('fName')||{}).value||'',loc:($('fLoc')||{}).value||'',note:($('fNote')||{}).value||''};
  var it=editId?items.find(function(x){return x.id===editId;}):null;
  openForm(it, true);
}
function openForm(it,keep){
  if(!keep && locked()) return;
  var isEdit=!!it; editId=isEdit?it.id:null;
  if(!keep){ sheetKind=isEdit?(it.kind||'other'):(sheetKind||'food'); _draft={}; }
  var d=keep?_draft:(it||{});
  var name=d.name!==undefined?d.name:(it?it.name:''), loc=d.loc!==undefined?d.loc:(it?it.loc:lastLoc()), note=d.note!==undefined?d.note:(it?it.note:'');
  if(!isEdit&&!keep&&loc===undefined) loc=lastLoc();
  var body='<div class="field"><div class="seg">'
    +Object.keys(KIND).map(function(k){return '<button type="button" data-k="'+k+'" class="'+(sheetKind===k?'on':'')+'">'+KIND[k].i+' '+KIND[k].n+'</button>';}).join('')+'</div></div>'
    +'<div class="field"><label>名稱</label><input id="fName" value="'+esc(name||'')+'" placeholder="例：牛奶、冰箱、延長線"></div>'
    +'<div class="field"><label>放在哪裡</label><select id="fLoc">'+locOptions(loc||'')+'</select></div>'
    +kindFields(sheetKind,it&&it.kind===sheetKind?it:{})
    +'<div class="field"><label>備註（選填）</label><textarea id="fNote" rows="2" style="resize:none" placeholder="序號、維修紀錄、放的細節…">'+esc(note||'')+'</textarea></div>';
  var f=(isEdit?'<button class="btn dg" id="bDel">刪除</button>':'')+'<button class="btn gh" id="bCancel">取消</button>'
    +(isEdit?'':'<button class="btn gh" id="bAgain">存＋再加</button>')+'<button class="btn pri" id="bSave">儲存</button>';
  openSheet(isEdit?'編輯物品':'新增物品',body,f,'form');
  bindSheet();
  $('bCancel').onclick=closeSheet; $('bSave').onclick=function(){saveForm(false);};
  if($('bAgain')) $('bAgain').onclick=function(){saveForm(true);};
  if($('bDel')) $('bDel').onclick=function(){ var n=(it&&it.name)||''; askConfirm('刪除「'+esc(n)+'」？','刪除後無法復原。',function(){ removeItem(it.id); closeSheet(); toast('已刪除'); },'刪除'); };
  if(!isEdit) setTimeout(function(){ try{$('fName').focus();}catch(e){} },80);
}
function saveForm(again){
  if(locked()) return;
  var name=($('fName').value||'').trim(); if(!name){ toast('請輸入名稱'); return; }
  var loc=$('fLoc').value; if(loc==='__new__') loc='';
  var old=editId?items.find(function(x){return x.id===editId;}):null;
  var it={id:editId||uid(),name:name,kind:sheetKind,loc:loc,note:($('fNote').value||'').trim(),created:(old&&old.created)||Date.now()};
  if(sheetKind==='appliance'){
    it.model=($('fModel').value||'').trim(); it.buyDate=$('fBuy').value||'';
    var y=parseFloat($('fWy').value)||0; it.warrantyYears=y||null;
    it.warrantyEnd=(y&&it.buyDate)?addMonths(it.buyDate,Math.round(y*12)):'';
    it.price=parseInt($('fPrice').value)||null; it.store=($('fStore').value||'').trim();
  } else if($('fExp')){ it.expiry=$('fExp').value||''; }
  setLastLoc(loc);
  writeItem(it);
  if(again){ editId=null; sheetKind=it.kind; _draft={name:'',loc:loc,note:''}; openForm(null,true); toast('已新增「'+name+'」'); }
  else { closeSheet(); toast(old?'已儲存':'已新增「'+name+'」'); }
}

/* ───────── 設定 ───────── */
function openSettings(){
  var L=getLocs();
  var body='<div class="setttl">📍 位置</div>'
    +L.map(function(l,i){return '<div class="setrow"><span>'+esc(l)+'</span>'
      +'<button class="mini" data-up="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'
      +'<button class="mini" data-rn="'+i+'">✎</button>'
      +'<button class="mini" data-dl="'+i+'">✕</button></div>';}).join('')
    +'<button class="btn gh" id="locAdd" style="margin-top:8px;width:100%">＋ 新增位置</button>'
    +'<div class="setttl">🔔 提醒（提前幾天）</div>'
    +'<div class="row2"><div class="field"><label>食材有效日期</label><input id="cFood" type="number" min="0" inputmode="numeric" value="'+cfg.foodDays+'"></div>'
    +'<div class="field"><label>家電保固</label><input id="cWar" type="number" min="0" inputmode="numeric" value="'+cfg.warrantyDays+'"></div></div>'
    +'<div class="hint">提醒會顯示在這裡的「快到期」，也會出現在生活管家的總覽與通知</div>'
    +'<div class="setttl">💾 備份</div>'
    +'<div style="display:flex;gap:8px"><button class="btn gh" id="bkOut" style="flex:1">⬇️ 匯出</button>'
    +'<label class="btn gh" style="flex:1;text-align:center;margin:0;line-height:24px">⬆️ 匯入<input id="bkIn" type="file" accept="application/json,.json" style="display:none"></label></div>';
  openSheet('設定',body,'<button class="btn pri" id="setOk">完成</button>','settings');
  var b=$('shB');
  b.querySelectorAll('[data-up]').forEach(function(x){x.onclick=function(){ if(locked())return; var i=+x.dataset.up,a=getLocs().slice(); var t=a[i];a[i]=a[i-1];a[i-1]=t; saveLocs(a); openSettings(); };});
  b.querySelectorAll('[data-rn]').forEach(function(x){x.onclick=function(){
    if(locked())return; var i=+x.dataset.rn,a=getLocs().slice(),old=a[i]; var n=(prompt('位置名稱',old)||'').trim();
    if(!n||n===old) return; if(a.indexOf(n)>=0){toast('已有這個位置');return;}
    a[i]=n; items.filter(function(it){return it.loc===old;}).forEach(function(it){ it.loc=n; if(db) db.ref(base()+'stock/'+it.id+'/loc').set(n); });
    if(curLoc===old) curLoc=n; saveLocs(a); openSettings(); };});
  b.querySelectorAll('[data-dl]').forEach(function(x){x.onclick=function(){
    if(locked())return; var i=+x.dataset.dl,a=getLocs().slice(),nm=a[i]; var cnt=items.filter(function(it){return it.loc===nm;}).length;
    askConfirm('刪除位置「'+esc(nm)+'」？',cnt?('裡面的 '+cnt+' 項物品不會被刪除，位置會變成「不指定」。'):'這個位置沒有物品。',function(){
      items.filter(function(it){return it.loc===nm;}).forEach(function(it){ it.loc=''; if(db) db.ref(base()+'stock/'+it.id+'/loc').remove(); });
      a.splice(i,1); if(curLoc===nm) curLoc=''; saveLocs(a); openSettings(); },'刪除'); };});
  $('locAdd').onclick=function(){ if(locked())return; var n=(prompt('新位置名稱')||'').trim(); var a=getLocs().slice(); if(!n)return; if(a.indexOf(n)>=0){toast('已有這個位置');return;} a.push(n); saveLocs(a); openSettings(); };
  $('setOk').onclick=function(){
    if(!READONLY){ var f=parseInt($('cFood').value), w=parseInt($('cWar').value);
      if(!isNaN(f)&&f>=0) cfg.foodDays=f; if(!isNaN(w)&&w>=0) cfg.warrantyDays=w; saveCfg(); }
    closeSheet(); render();
  };
  $('bkOut').onclick=function(){
    var blob=new Blob([JSON.stringify({v:2,items:items,locs:getLocs(),cfg:cfg},null,1)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='庫存備份_'+today()+'.json'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  };
  $('bkIn').onchange=function(){
    if(locked()||!this.files[0]) return; var r=new FileReader();
    r.onload=function(){ try{
      var d=JSON.parse(r.result); if(!d||!Array.isArray(d.items)) throw 0;
      d.items.forEach(function(x){ if(x&&x.name){ x.id=x.id||uid(); writeItem(x); } });
      if(Array.isArray(d.locs)&&d.locs.length){ var a=getLocs().slice(); d.locs.forEach(function(l){if(a.indexOf(l)<0)a.push(l);}); saveLocs(a); }
      toast('已匯入 '+d.items.length+' 項'); closeSheet();
    }catch(e){ toast('備份檔格式不對'); } };
    r.readAsText(this.files[0]);
  };
}

/* ───────── 登入、方案驗證 ───────── */
var PLAN_CACHE_KEY="cal_plan_cache", PLAN_GRACE_MS=3*86400000, VERIFY_TIMEOUT_MS=8000;
function isFullPlan(p){return p==="basic"||p==="full"||p==="family"||p==="trial"||p==="admin";}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){var e=new Error("timeout");e.code="TIMEOUT";rej(e);},ms);})]);}
function isPermDenied(e){var c=String((e&&e.code)||"").toUpperCase(),m=String((e&&e.message)||"");return c.indexOf("PERMISSION")>=0||/permission/i.test(m);}
function planFromCache(email){
  var c=null; try{c=JSON.parse(localStorage.getItem(PLAN_CACHE_KEY)||"null");}catch(e){}
  if(!c||c.email!==String(email||"").toLowerCase()||!c.verifiedAt) return "free";
  var now=Date.now(); if(now<c.verifiedAt||now-c.verifiedAt>PLAN_GRACE_MS) return "free";
  if(c.expiry){var exp=Date.parse(c.expiry+"T23:59:59"); if(exp&&now>exp) return "free";}
  return c.plan||"free";
}
function savePlanCache(email,plan,expiry){try{localStorage.setItem(PLAN_CACHE_KEY,JSON.stringify({email:String(email||"").toLowerCase(),plan:plan,expiry:expiry||"",verifiedAt:Date.now()}));}catch(e){}}
function verifyAccess(allow,deny){
  var cal=userEmail;
  if(cal&&cal.toLowerCase()===ADMIN_EMAIL){allow();return;}
  if(!cal||cal.indexOf('@')<0){deny("free");return;}
  function fromCache(){var p=planFromCache(cal); if(isFullPlan(p)) allow(); else deny(p);}
  if(!db){fromCache();return;}
  withTimeout(db.ref("subscribers/"+emailKey(cal)).once("value"),VERIFY_TIMEOUT_MS).then(function(snap){
    var s=snap.val(); if(!s){deny("free");return;}
    db.ref(".info/serverTimeOffset").once("value").then(function(o){return Date.now()+(o.val()||0);}).catch(function(){return Date.now();}).then(function(now){
      var expMs=s.expiry?Date.parse(s.expiry+"T23:59:59"):0, expired=expMs&&now>expMs, plan=expired?"free":(s.plan||"free");
      savePlanCache(cal,plan,s.expiry); if(isFullPlan(plan)) allow(); else deny(plan);
    });
  }).catch(function(e){ if(isPermDenied(e)){deny("free");return;} fromCache(); });
}
function enter(email){
  userEmail=email;
  try{ $('verTag').textContent=APP_VER+(String(email).toLowerCase()===ADMIN_EMAIL?' · '+BUILD_ID:''); }catch(e){}
  $('loginPage').style.display='none'; $('appWrap').style.display='block';
  loadCache(); render();
  function go(){ migrateOnce(function(){ listen(); render(); }); }
  verifyAccess(function(){READONLY=false;go();},function(){READONLY=true;$('roBar').style.display='flex';go();});
}
(function(){
  var auth=null; try{ if(FB_READY&&firebase.auth) auth=firebase.auth(); }catch(e){}
  function showLogin(){ $('loginPage').style.display='flex'; }
  if(!auth){ var last=null; try{last=localStorage.getItem('cal_auth');}catch(e){} if(last&&last.indexOf('@')>=0) enter(last); else showLogin(); return; }
  var settled=false, unsub=auth.onAuthStateChanged(function(u){
    if(u&&u.email){ if(!settled){settled=true;try{unsub();}catch(e){} enter(u.email);} }
    else if(!settled){ setTimeout(function(){ if(!settled){settled=true;try{unsub();}catch(e){} showLogin(); } },800); }
  });
})();

/* ───────── 事件 ───────── */
$('addBtn').onclick=function(){ sheetKind=sheetKind||'food'; openForm(null); };
$('goSet').onclick=openSettings;
$('goCal').onclick=function(){ location.href=CAL_URL; };
$('q').addEventListener('input',render);
$('kindChips').addEventListener('click',function(e){ var b=e.target.closest('[data-kind]'); if(!b) return; curKind=b.dataset.kind; render(); });
$('locSel').addEventListener('change',function(){ curLoc=this.value; render(); });
$('list').addEventListener('click',function(e){ var c=e.target.closest('[data-id]'); if(!c) return; var it=items.find(function(x){return x.id===c.dataset.id;}); if(it) openForm(it); });
$('ovl').addEventListener('click',function(e){ if(e.target===$('ovl')) closeSheet(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

function appHandleBack(){
  if($('ovl').classList.contains('open')){ closeSheet(); return true; }
  return false;
}
(function(){
  if(!window.history||!history.pushState) return;
  var armed=false,tm=null;
  function guard(){try{history.pushState({haGuard:1},'');}catch(e){}}
  guard();
  window.addEventListener('popstate',function(){
    if(armed) return;
    var h=false; try{h=appHandleBack();}catch(e){}
    if(h){guard();return;}
    armed=true; toast('再按一次返回鍵離開',2000);
    clearTimeout(tm); tm=setTimeout(function(){armed=false;guard();},2000);
  });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){ if(nw.state==='installed'&&navigator.serviceWorker.controller){ $('updateBar').style.display='flex'; } });
      });
    }).catch(function(){});
    var reloaded=false,asked=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){ if(!asked||reloaded) return; reloaded=true; location.reload(); });
    $('updateBtn').addEventListener('click',function(){
      asked=true;
      navigator.serviceWorker.getRegistration().then(function(reg){ if(reg&&reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); });
      $('updateBar').style.display='none';
    });
  });
}
</script>
